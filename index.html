<!DOCTYPE html>
<html>

<head>

<base target="_top">

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Склад - поиск товара</title>


<!-- ZXing -->
<script src="https://unpkg.com/@zxing/library@latest"></script>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    background:#f3f5f7;

    font-family:Arial,sans-serif;

    color:#333;

}


.container{

    max-width:700px;

    margin:auto;

    padding:20px;

}


h1{

    text-align:center;

    color:#1976d2;

    margin-bottom:20px;

}



.search-box{

    background:#fff;

    padding:20px;

    border-radius:12px;

    box-shadow:0 4px 15px rgba(0,0,0,.15);

}



input{

    width:100%;

    padding:16px;

    font-size:22px;

    text-align:center;

    border-radius:10px;

    border:1px solid #ccc;

}



input:focus{

    outline:none;

    border-color:#1976d2;

}



.buttons{

    display:flex;

    gap:10px;

    margin-top:15px;

}



button{

    flex:1;

    padding:14px;

    border:none;

    border-radius:10px;

    background:#1976d2;

    color:white;

    font-size:18px;

    cursor:pointer;

}



button:active{

    transform:scale(.98);

}



#scanner{

    display:none;

    margin-top:20px;

}



#video{

    width:100%;

    background:#000;

    border-radius:10px;

}



.card{

    background:white;

    margin-top:20px;

    padding:20px;

    border-radius:12px;

    box-shadow:0 4px 15px rgba(0,0,0,.15);

}



.card img{

    width:100%;

    max-height:250px;

    object-fit:contain;

    border-radius:10px;

}



.title{

    font-size:24px;

    font-weight:bold;

    margin:15px 0;

}



.row{

    margin-top:10px;

    font-size:18px;

}



.label{

    color:#777;

}



.value{

    font-weight:bold;

}



.cell{

    font-size:28px;

    color:#d32f2f;

    font-weight:bold;

}



.item{

    padding:15px 0;

    border-top:1px solid #ddd;

}



.item:first-child{

    border-top:none;

}



.item img{

    width:120px;

}



.count{

    margin-top:15px;

    font-size:20px;

    font-weight:bold;

}



.message{

    text-align:center;

    font-size:20px;

}



.loading{

    text-align:center;

    font-size:22px;

}



@media(max-width:600px){


.container{

    padding:10px;

}


.buttons{

    flex-direction:column;

}


input{

    font-size:20px;

}


button{

    font-size:16px;

}


}


</style>


</head>


<body>


<div class="container">


<h1>
📦 Склад
</h1>



<div class="search-box">


<input

id="search"

type="text"

placeholder="Артикул или ячейка"

autocomplete="off">



<div class="buttons">


<button onclick="startSearch()">

🔎 Найти

</button>



<button onclick="startScanner()">

📷 Сканировать

</button>


</div>



<div id="scanner">


<video

id="video"

autoplay

playsinline>

</video>


</div>



</div>



<div id="result"></div>


</div>


<script>


// ================================
// REST API
// ================================


const API_URL =
"https://script.google.com/macros/s/AKfycbzvTP0fucQOfvu-H3eOnseMO2cDa2bzMdKgYIejdlYdWeXupyQ-7qaKEiKek6NzWUdt0g/exec";



let codeReader = null;



// ================================
// Основной запуск поиска
// ================================


function startSearch(){


let value =
document
.getElementById("search")
.value
.trim();



if(value===""){


showMessage(
"Введите артикул или ячейку"
);


return;


}



console.log(
"Поиск:",
value
);



/*

Логика:

Есть буква
→ ячейка

Только цифры
→ товар

*/


if(/[A-Za-zА-Яа-я]/.test(value)){


console.log(
"Режим: ЯЧЕЙКА"
);


searchCell(value);



}

else{


console.log(
"Режим: ТОВАР"
);


searchArticle(value);



}



}



// ================================
// Поиск товара
// ================================


function searchArticle(article){


article =
formatArticle(article);



console.log(
"Артикул:",
article
);



showLoading();



fetch(

API_URL+
"?article="+
encodeURIComponent(article)

)


.then(r=>r.json())


.then(data=>{


console.log(
"Ответ товара:",
data
);


showProduct(data);


})

.catch(e=>{


console.error(e);


showMessage(
"Ошибка соединения"
);


});



}

// ================================
// Поиск содержимого ячейки
// ================================


function searchCell(cell){


cell =
cell.trim()
.toUpperCase();



console.log(
"Ячейка:",
cell
);



showLoading();



fetch(

API_URL+
"?cell="+
encodeURIComponent(cell)

)


.then(r=>r.json())


.then(data=>{


console.log(
"Ответ ячейки:",
data
);



showCell(data);



})

.catch(e=>{


console.error(e);


showMessage(
"Ошибка соединения"
);


});


}






// ================================
// Форматирование артикула
//
// 250301
// ↓
// 25.03.01
//
// 2503001
// ↓
// 25.03.001
//
// ================================


function formatArticle(value){



let number =
String(value)
.replace(/\D/g,"");



if(number.length < 5){


return value;


}



return (

number.substring(0,2)

+

"."

+

number.substring(2,4)

+

"."

+

number.substring(4)

);


}







// ================================
// Маска ввода артикула
// только для цифр
//
// 250301
// ↓
// 25.03.01
//
// ================================


document
.getElementById("search")
.addEventListener(
"input",
function(){



let value =
this.value;



/*

Если ввод только цифры,
ставим точки


*/


if(/^\d+$/.test(value)){



value =
value.replace(/\D/g,"");



if(value.length>4){


value =

value.substring(0,2)

+

"."

+

value.substring(2,4)

+

"."

+

value.substring(4);



}



this.value=value;



}


});







// ================================
// СКАНЕР ZXing
//
// Исправлено:
// - буквы сохраняются
// - Code128 работает
// - нет двойной обработки
//
// ================================



async function startScanner(){


const video =
document.getElementById("video");



document
.getElementById("scanner")
.style.display="block";



try{



codeReader =
new ZXing.BrowserMultiFormatReader();



const devices =
await codeReader
.listVideoInputDevices();



console.log(
"Камеры:",
devices
);



if(devices.length===0){



showMessage(
"Камера не найдена"
);



return;


}





// выбираем заднюю камеру


let deviceId =
devices[devices.length-1]
.deviceId;





for(let device of devices){


let label =
device.label.toLowerCase();



if(

label.includes("back")

||

label.includes("rear")

||

label.includes("environment")

){


deviceId =
device.deviceId;


break;


}


}






codeReader.decodeFromVideoDevice(


deviceId,


video,



(result,error)=>{


if(result){



/*
ВАЖНО:

берём оригинальный текст

без formatArticle()

*/


let code =
result.text.trim();



console.log(

"ПОЛНЫЙ ШТРИХКОД:",

JSON.stringify(code)

);





document
.getElementById("search")
.value =
code;





// вибрация


if(navigator.vibrate){


navigator.vibrate(200);


}





stopScanner();





setTimeout(()=>{


startSearch();



},300);



}




}



);




}

catch(error){



console.error(
"Ошибка камеры:",
error
);



showMessage(

"Ошибка камеры: "

+

error.name

);


}




}







// ================================
// Остановка камеры
// ================================


function stopScanner(){



if(codeReader){


codeReader.reset();


codeReader=null;


}



document
.getElementById("scanner")
.style.display="none";


}




// ================================
// Индикатор загрузки
// ================================


function showLoading(){


document
.getElementById("result")
.innerHTML=


`

<div class="card loading">

⏳ Поиск...

</div>

`;



}




// ================================
// Сообщения
// ================================


function showMessage(text){



document
.getElementById("result")
.innerHTML=


`

<div class="card message">

${text}

</div>

`;



}
  
// ================================
// Вывод карточки товара
// ================================


function showProduct(data){


const result =
document.getElementById("result");



if(!data || !data.success){


result.innerHTML =

`

<div class="card message">

❌ ${
data && data.error
?
data.error
:
"Товар не найден"
}

</div>

`;



return;


}





result.innerHTML =


`

<div class="card">



${
data.photo

?

`

<img src="${data.photo}">

`

:

""

}




<div class="title">

${data.name}

</div>





<div class="row">

<span class="label">

Артикул:

</span>


<span class="value">

${data.article}

</span>


</div>





<div class="row">

<span class="label">

Количество:

</span>


<span class="value">

${data.quantity}

</span>


</div>





<div class="row">


<span class="label">

Ячейка хранения:

</span>


<div class="cell">

${data.cell}

</div>


</div>





</div>

`;



}







// ================================
// Вывод содержимого ячейки
// ================================


function showCell(data){


const result =
document.getElementById("result");





if(

!data

||

!data.success

||

!data.products

||

data.products.length===0

){



result.innerHTML =


`

<div class="card message">


📦 В ячейке нет товаров


</div>


`;



return;


}






let html =


`

<div class="card">



<div class="title">

📍 ${data.cell}

</div>





<div class="count">


Позиций:

${data.count}



<br>



Всего единиц:

${data.totalQuantity}



</div>


`;






data.products.forEach(

(product,index)=>{



html +=



`

<div class="item">





${
product.photo

?

`

<img src="${product.photo}">

`

:

""

}






<div class="title">

${index+1}. ${product.name}

</div>





<div class="row">


<span class="label">

Артикул:

</span>



<strong>

${product.article}

</strong>



</div>







<div class="row">


<span class="label">

Количество:

</span>



<strong>

${product.quantity}

</strong>



</div>





</div>


`;



}

);






html +=


`

</div>

`;




result.innerHTML = html;



}





</script>


</body>


</html>
