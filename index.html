<!DOCTYPE html>
<html>

<head>

<base target="_top">

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Поиск товара</title>


<script src="https://unpkg.com/@zxing/library@latest"></script>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

background:#f3f5f7;

font-family:Arial,sans-serif;

color:#333;

}


.container{

max-width:700px;

margin:auto;

padding:20px;

}


h1{

text-align:center;

margin-bottom:20px;

color:#1976d2;

}



.search-box{

background:white;

padding:20px;

border-radius:12px;

box-shadow:0 4px 15px rgba(0,0,0,.15);

}



input{

width:100%;

padding:16px;

font-size:22px;

border:1px solid #ccc;

border-radius:10px;

outline:none;

}



input:focus{

border-color:#1976d2;

}



.buttons{

display:flex;

gap:10px;

margin-top:15px;

}



button{

flex:1;

padding:14px;

border:none;

border-radius:10px;

background:#1976d2;

color:white;

font-size:18px;

cursor:pointer;

}



button:hover{

background:#1565c0;

}



#scanner{

display:none;

margin-top:20px;

}



#video{

width:100%;

border-radius:10px;

background:black;

}



.card{

background:white;

margin-top:20px;

padding:20px;

border-radius:12px;

box-shadow:0 4px 15px rgba(0,0,0,.15);

}



.card img{

width:100%;

max-height:300px;

object-fit:contain;

border-radius:10px;

margin-bottom:15px;

}



.title{

font-size:24px;

font-weight:bold;

margin-bottom:15px;

}



.row{

margin-top:10px;

font-size:18px;

}



.label{

color:#777;

}



.value{

font-weight:bold;

}



.cell{

font-size:28px;

color:#d32f2f;

font-weight:bold;

}



.item{

border-top:1px solid #ddd;

padding:15px 0;

}



.item img{

width:120px;

height:120px;

object-fit:contain;

}



.count{

font-size:20px;

font-weight:bold;

margin-top:15px;

}



.message{

text-align:center;

font-size:20px;

padding:20px;

}



.loading{

text-align:center;

font-size:22px;

padding:25px;

}



@media(max-width:600px){

.container{

padding:10px;

}


.buttons{

flex-direction:column;

}


input{

font-size:20px;

}


}


</style>


</head>



<body>


<div class="container">


<h1>
📦 Учет товаров
</h1>



<div class="search-box">


<input

id="search"

type="text"

placeholder="Артикул или ячейка"

autocomplete="off">



<div class="buttons">


<button onclick="startSearch()">

🔎 Найти

</button>



<button onclick="startScanner()">

📷 Сканировать

</button>



</div>




<div id="scanner">


<video

id="video"

autoplay

playsinline>

</video>


</div>



</div>



<div id="result"></div>



</div>



<script>


const API_URL =

"https://script.google.com/macros/s/AKfycbzvTP0fucQOfvu-H3eOnseMO2cDa2bzMdKgYIejdlYdWeXupyQ-7qaKEiKek6NzWUdt0g/exec";



let codeReader=null;



// ===============================
// Основной запуск поиска
// ===============================


function startSearch(){


let value =

document
.getElementById("search")
.value
.trim();



if(value===""){


showMessage(
"Введите артикул или ячейку"
);


return;


}




// Ячейка только если есть латинская буква

if(/[A-Za-z]/.test(value)){


searchCell(value);


}

else{


searchArticle(value);


}


}

    

// ===============================
// Поиск товара
// ===============================


function searchArticle(article){


article = formatArticle(article);


showLoading();



fetch(
API_URL +
"?article=" +
encodeURIComponent(article)
)


.then(response=>response.json())


.then(data=>{


console.log(
"Ответ товара:",
data
);


showProduct(data);


})


.catch(error=>{


console.error(error);


showMessage(
"Ошибка соединения"
);


});


}






// ===============================
// Поиск ячейки
// ===============================


function searchCell(cell){


cell =
cell.toUpperCase();



showLoading();



fetch(

API_URL +
"?cell=" +
encodeURIComponent(cell)

)



.then(response=>response.json())


.then(data=>{


console.log(
"Ответ ячейки:",
data
);


showCell(data);


})


.catch(error=>{


console.error(error);


showMessage(
"Ошибка соединения"
);


});


}






// ===============================
// Форматирование артикула
//
// 2503001
// -> 25.03.001
//
// ===============================


function formatArticle(value){



let number =

String(value)

.replace(/\D/g,"");



if(
number.length>=5 &&
number.length<=7
){



return (

number.substring(0,2)

+

"."

+

number.substring(2,4)

+

"."

+

number.substring(4)

);


}



return value;


}







// ===============================
// Маска ввода
// ===============================


document

.getElementById("search")

.addEventListener(

"input",

function(){



let value=this.value;



// если вводятся только цифры


if(/^\d+$/.test(value)){



value=value.replace(/\D/g,"");



if(value.length>4){



value =

value.substring(0,2)

+

"."

+

value.substring(2,4)

+

"."

+

value.substring(4);



}



this.value=value;


}



}

);







// ===============================
// СКАНЕР ZXING
// ===============================


async function startScanner(){



const video =

document.getElementById("video");



document

.getElementById("scanner")

.style.display="block";





try{



codeReader =

new ZXing.BrowserMultiFormatReader();





const devices =

await codeReader
.listVideoInputDevices();





if(devices.length===0){


showMessage(
"Камера не найдена"
);


return;


}




// задняя камера телефона

let deviceId =

devices[devices.length-1]
.deviceId;





codeReader

.decodeFromVideoDevice(

deviceId,

video,

(result,error)=>{



if(result){



let code =

result.text.trim();



console.log(

"ПОЛНЫЙ ШТРИХКОД:",

JSON.stringify(code)

);



// НЕ удаляем буквы!
// важно для Code128


document

.getElementById("search")

.value=code;





stopScanner();





setTimeout(()=>{


startSearch();


},300);



}



}


);



}

catch(error){



console.error(

"Ошибка камеры:",

error

);



showMessage(

"Ошибка камеры: "

+

error.message

);



}



}







// ===============================
// Остановка сканера
// ===============================


function stopScanner(){



if(codeReader){


codeReader.reset();


}



document

.getElementById("scanner")

.style.display="none";



}






// ===============================
// Сообщения
// ===============================


function showLoading(){



document

.getElementById("result")

.innerHTML=`

<div class="card loading">

⏳ Поиск...

</div>

`;



}



function showMessage(text){



document

.getElementById("result")

.innerHTML=`

<div class="card message">

${text}

</div>

`;



}

    

// ===============================
// Карточка товара
// ===============================


function showProduct(data){


console.log(
"Карточка товара:",
JSON.stringify(data)
);



const result =

document.getElementById("result");





if(!data.success){


result.innerHTML=`

<div class="card message">

❌ ${data.error}

</div>

`;


return;


}






result.innerHTML=`

<div class="card">


${
data.photo

?

`

<img
src="${data.photo}"
    style="max-width:100%;max-height:300px"
    onload="console.log('Фото загрузилось')"
    onerror="console.log('Ошибка загрузки', this.src)"
>

`

:

`

<div style="
text-align:center;
color:#999;
padding:15px;
">

📷 Фото отсутствует

</div>

`

}





<div class="title">

${data.name}

</div>





<div class="row">

<span class="label">

Артикул:

</span>


<span class="value">

${data.article}

</span>


</div>





<div class="row">

<span class="label">

Количество:

</span>


<span class="value">

${data.quantity}

</span>


</div>






<div class="row">


<div class="label">

Ячейка хранения:

</div>



<div class="cell">

${data.cell}

</div>



</div>



</div>

`;



}








// ===============================
// Просмотр содержимого ячейки
// ===============================


function showCell(data){



const result =

document.getElementById("result");





console.log(

"Карточка ячейки:",

JSON.stringify(data)

);






if(

!data.success ||

!data.products ||

data.products.length===0

){



result.innerHTML=`

<div class="card message">

📦 В ячейке нет товаров

</div>

`;



return;


}






let html = `


<div class="card">


<div class="title">

📍 ${data.cell}

</div>



<div class="count">

Позиций:

${data.count}


<br>


Всего единиц:

${data.totalQuantity}


</div>


`;







data.products.forEach(

function(product,index){



html += `


<div class="item">



${
product.photo

?

`

<img

src="${product.photo}"

onerror="this.style.display='none'"

>

`

:

""

}



<b>

${index+1}. ${product.name}

</b>





<div class="row">

<span class="label">

Артикул:

</span>


<strong>

${product.article}

</strong>


</div>






<div class="row">


<span class="label">

Количество:

</span>


<strong>

${product.quantity}

</strong>



</div>




</div>



`;



}

);






html += `

</div>

`;



result.innerHTML=html;



}





</script>


</body>


</html>
